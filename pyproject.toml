[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-broll-engine"
version = "0.1.0"
description = "Background API for turning scripts and narration into captioned B-roll videos."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy>=2.0,<3",
  "Pillow>=10,<12",
  "minio>=7.2,<8",
  "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
vision = ["open_clip_torch>=2.26,<3"]
kokoro = ["kokoro>=0.9.4,<1", "soundfile>=0.12,<1"]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
deploy = ["modal>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
